<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manati - Editor de Markdown Profissional</title>
    <link rel="icon" type="image/png" href="assets/manati_logo_v2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/themes.css" rel="stylesheet">
    
    <!-- DOMPurify para sanitização HTML -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
</head>
<body data-bs-theme="dark">
    <!-- Navbar será carregada aqui -->
    <div id="navbar-container"></div>

    <!-- Container principal -->
    <div class="main-container">
        <!-- Sidebar será carregada aqui -->
        <div id="sidebar-container"></div>

        <!-- Área do editor -->
        <div class="editor-area">
            <div class="editor-container">
                <!-- Abas do editor serão carregadas aqui -->
                <div id="editor-tabs-container"></div>
                
                <div class="tab-content">
                    <!-- Aba Preview -->
                    <div class="tab-pane fade show active" id="preview-tab">
                        <div class="preview-container" id="previewContainer">
                            <div class="text-muted text-center">
                                <i class="bi bi-eye-slash" style="font-size: 3rem;"></i>
                                <p class="mt-3">Selecione um arquivo para visualizar o preview</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Aba Visual -->
                    <div class="tab-pane fade" id="visual-tab">
                        <div class="visual-editor-wrapper">
                            <div class="file-info" id="visualFileInfo" style="display: none;">
                                <small class="text-muted">
                                    <i class="bi bi-palette"></i>
                                    <span id="visualCurrentFileName">Nenhum arquivo selecionado</span>
                                </small>
                            </div>
                            
                            <!-- Barra de Ferramentas Visual -->
                            <div class="visual-toolbar" id="visualToolbar" style="display: none;">
                                <div class="btn-toolbar" role="toolbar">
                                    <div class="btn-group btn-group-sm me-2" role="group">
                                        <button type="button" class="btn btn-outline-secondary" data-command="bold" title="Negrito (Ctrl+B)">
                                            <i class="bi bi-type-bold"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="italic" title="Itálico (Ctrl+I)">
                                            <i class="bi bi-type-italic"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="underline" title="Sublinhado (Ctrl+U)">
                                            <i class="bi bi-type-underline"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="btn-group btn-group-sm me-2" role="group">
                                        <button type="button" class="btn btn-outline-secondary" data-command="h1" title="Título 1">H1</button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="h2" title="Título 2">H2</button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="h3" title="Título 3">H3</button>
                                    </div>
                                    
                                    <div class="btn-group btn-group-sm me-2" role="group">
                                        <button type="button" class="btn btn-outline-secondary" data-command="insertUnorderedList" title="Lista">
                                            <i class="bi bi-list-ul"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="insertOrderedList" title="Lista Numerada">
                                            <i class="bi bi-list-ol"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="blockquote" title="Citação">
                                            <i class="bi bi-quote"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="btn-group btn-group-sm me-2" role="group">
                                        <button type="button" class="btn btn-outline-primary" id="insertImageBtn" title="Inserir Imagem">
                                            <i class="bi bi-image"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-primary" id="insertLinkBtn" title="Inserir Link">
                                            <i class="bi bi-link-45deg"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-primary" id="insertFileBtn" title="Anexar Arquivo">
                                            <i class="bi bi-paperclip"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="btn-group btn-group-sm" role="group">
                                        <button type="button" class="btn btn-outline-secondary" data-command="code" title="Código Inline">
                                            <i class="bi bi-code"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="codeblock" title="Bloco de Código">
                                            <i class="bi bi-code-square"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" data-command="table" title="Tabela">
                                            <i class="bi bi-table"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div 
                                id="visualEditor" 
                                class="visual-editor" 
                                contenteditable="true"
                                data-placeholder="Comece a escrever aqui... Use a barra de ferramentas acima para formatar o texto."
                                style="display: none;"
                            ></div>
                            
                            <div class="visual-editor-placeholder" id="visualEditorPlaceholder">
                                <div class="text-center">
                                    <i class="bi bi-palette" style="font-size: 3rem;"></i>
                                    <h5 class="mt-3">Editor Visual</h5>
                                    <p>Selecione um arquivo ou crie um novo para começar a editar com o editor visual.</p>
                                    <small class="text-muted">O editor visual facilita a formatação sem precisar conhecer markdown.</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Aba Markdown -->
                    <div class="tab-pane fade" id="editor-tab">
                        <div class="editor-wrapper">
                            <div class="file-info" id="fileInfo" style="display: none;">
                                <small class="text-muted">
                                    <i class="bi bi-file-text"></i>
                                    <span id="currentFileName">Nenhum arquivo selecionado</span>
                                </small>
                            </div>
                            <textarea 
                                class="form-control editor-textarea" 
                                id="markdownEditor" 
                                placeholder="Selecione um arquivo ou crie um novo para começar a editar..."
                                disabled
                            ></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Input oculto para upload de arquivos -->
    <input type="file" id="fileUpload" style="display: none;" multiple accept="*/*">
    <input type="file" id="imageUpload" style="display: none;" accept="image/*">

    <!-- Modais serão carregados aqui -->
    <div id="modals-container"></div>

    <!-- Scripts externos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@5.1.1/marked.min.js"></script>
    
    <!-- Logger utilitário -->
    <script src="js/utils/logger.js"></script>
    
    <!-- Configurar LOG_DEBUG para false por padrão -->
    <script>
        // Configurar debug como false por padrão se não estiver definido
        if (!localStorage.getItem('LOG_DEBUG')) {
            localStorage.setItem('LOG_DEBUG', 'false');
        }
    </script>
    
    <!-- Carregador de componentes e inicializador -->
    <script>
        // Função para carregar componentes HTML
        async function loadComponent(containerId, componentPath) {
            try {
                const response = await fetch(componentPath);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const html = await response.text();
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = html;
                    logger.debug(`✅ Componente carregado: ${componentPath}`);
                } else {
                    logger.error(`❌ Container não encontrado: ${containerId}`);
                }
            } catch (error) {
                logger.error(`❌ Erro ao carregar componente ${componentPath}:`, error);
            }
        }

        // Função para carregar script dinamicamente
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    logger.debug(`✅ Script carregado: ${src}`);
                    resolve();
                };
                script.onerror = (error) => {
                    logger.error(`❌ Erro ao carregar script ${src}:`, error);
                    reject(error);
                };
                document.head.appendChild(script);
            });
        }

        // Função principal para inicializar tudo
        async function initializeApp() {
            try {
                logger.debug('🚀 Iniciando aplicação modular...');
                
                // 1. Carregar todos os componentes HTML
                logger.debug('📦 Carregando componentes HTML...');
                await Promise.all([
                    loadComponent('navbar-container', 'components/navbar.html'),
                    loadComponent('sidebar-container', 'components/sidebar.html'),
                    loadComponent('editor-tabs-container', 'components/editor-tabs.html'),
                    loadComponent('modals-container', 'components/modals.html')
                ]);
                
                // 2. Aguardar um pouco para garantir que o DOM está atualizado
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // 3. Carregar visual-editor.js
                logger.debug('🎨 Carregando visual editor...');
                await loadScript('js/visual-editor.js');
                
                // 4. Aguardar um pouco mais
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // 5. Carregar e inicializar o app modular
                logger.debug('🔧 Inicializando aplicação modular...');
                const appModule = await import('./js/app-modular.js');
                
                if (appModule.default && typeof appModule.default === 'function') {
                    // Verificar se já não foi inicializado
                    if (!window.manatiEditor) {
                        window.manatiEditor = new appModule.default();
                        logger.debug('✅ Aplicação modular inicializada com sucesso!');
                    } else {
                        logger.debug('✅ Aplicação modular já estava inicializada!');
                    }
                } else {
                    logger.debug('✅ Módulo app-modular carregado');
                }
                
            } catch (error) {
                logger.error('❌ Erro ao inicializar aplicação:', error);
            }
        }

        // Inicializar quando DOM estiver pronto
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
