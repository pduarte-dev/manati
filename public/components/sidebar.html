<!-- Componente: Sidebar com explorador de arquivos -->
<div class="sidebar bg-body-secondary" id="sidebar">
    <div class="sidebar-header">
        <!-- Botões de ação lado a lado -->
        <div class="action-buttons d-flex gap-2 mb-2">
            <button class="btn btn-outline-success btn-sm flex-fill" id="newFileBtn" title="Novo arquivo">
                <i class="bi bi-file-plus"></i> Novo
            </button>
            <button class="btn btn-outline-primary btn-sm flex-fill" id="newFolderBtn" title="Nova pasta">
                <i class="bi bi-folder-plus"></i> Pasta
            </button>
        </div>
        
        <!-- Campo de busca sempre visível -->
        <div class="search-container">
            <div class="input-group input-group-sm">
                <span class="input-group-text">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control" id="fileSearchInput" placeholder="Buscar arquivos...">
                <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn" title="Limpar busca">
                    <i class="bi bi-x"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="file-tree" id="fileTree">
        <!-- Arquivos serão carregados aqui -->
    </div>
    
    <!-- Informações do usuário (se autenticado) -->
    <div class="user-info" id="userInfo" style="display: none;">
        <div class="user-avatar">
            <img id="userAvatar" src="" alt="Avatar" class="rounded-circle">
        </div>
        <div class="user-details">
            <div class="user-name" id="userName"></div>
            <div class="user-email" id="userEmail"></div>
        </div>
        <button class="btn btn-outline-secondary btn-sm logout-btn" id="logoutBtn" title="Sair">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </div>
</div>
