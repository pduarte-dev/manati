<!-- Componente: Barra de navegação -->
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <img src="assets/manati_logo_v2.png" alt="Manati Logo" class="logo">
            <h3 class="title-navbar">MANATI</h3>
        </span>
        <div class="d-flex align-items-center gap-2">
            <!-- Botão de Git Commit - sempre visível -->
            <button class="btn btn-info btn-sm" id="gitCommitBtn" title="Publicar alterações no Git" disabled>
                <i class="bi bi-git"></i> <span id="gitBtnText">Publicar</span>
                <span class="badge bg-primary ms-1" id="modifiedFilesCount" style="display: none;">0</span>
            </button>
            
            <!-- Grupo de botões de documento - só aparecem quando arquivo está aberto -->
            <div class="document-actions" id="documentActions" style="display: none;">
                <button class="btn btn-primary btn-sm" id="saveBtn">
                    <i class="bi bi-save"></i> Salvar
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="closeDocumentBtn" title="Fechar documento">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            
            <button class="btn btn-outline-secondary btn-sm" id="themeToggle">
                <i class="bi bi-moon-fill" id="themeIcon"></i>
            </button>
        </div>
    </div>
</nav>
